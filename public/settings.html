<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - PRP</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Settings</h1>
      <label for="display-name">Display Name:</label>
      <input type="text" id="display-name" placeholder="Enter your display name" />
      <div>
        <label for="dark-mode">Dark Mode:</label>
        <input type="checkbox" id="dark-mode" />
      </div>
      <button id="save-btn" type="button">Save</button>
      <a href="/" id="cancel-btn">Cancel</a>
      <p id="feedback" style="display:none;"></p>
    </main>
    <script src="/app.js"></script>
    <script>
      const saveButton = document.getElementById('save-btn');
      const feedbackElement = document.getElementById('feedback');
      const darkModeToggle = document.getElementById('dark-mode');

      saveButton.addEventListener('click', () => {
        // Simulate a save action and show feedback
        feedbackElement.style.display = 'block';
        feedbackElement.innerText = 'Settings saved successfully!';
        setTimeout(() => {
          feedbackElement.style.display = 'none';
        }, 3000);
      });

      darkModeToggle.addEventListener('change', () => {
        // Toggle dark mode
        document.body.classList.toggle('dark-mode', darkModeToggle.checked);
      });
    </script>
  </body>
</html>
