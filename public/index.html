<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRP</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body { margin: 0; overflow: hidden; }
      #hero {
        position: relative;
        height: 100vh;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(30, 41, 59, 0.8)),
                    url('path/to/dynamic-background.jpg');
        background-size: cover;
        background-attachment: fixed;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
      }
      #cta-buttons {
        margin-top: 20px;
        display: flex;
        gap: 15px;
      }
      .cta-button {
        background: rgba(79, 131, 225, 0.8);
        border: none;
        border-radius: 8px;
        padding: 15px 25px;
        font-size: 18px;
        cursor: pointer;
        transition: transform 0.3s, box-shadow 0.3s;
      }
      .cta-button:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 15px rgba(79, 131, 225, 0.3);
      }
    </style>
  </head>
  <body>
    <div id="hero">
      <h1>Welcome to the PRP Web App</h1>
      <p>Experience our immersive landing page!</p>
      <div id="cta-buttons">
        <button id="login-btn" class="cta-button" type="button">Login with Google</button>
        <button id="logout-btn" class="cta-button" type="button">Logout</button>
      </div>
    </div>
    <div id="login-modal" class="modal">
      <div class="modal-content">
        <span class="close-button">×</span>
        <h2>Login</h2>
        <form id="login-form">
          <label for="email">Email:</label>
          <input type="email" id="email" required />
          <label for="password">Password:</label>
          <input type="password" id="password" required />
          <button type="submit" id="sign-in-button">Sign In</button>
          <div id="error-banner" role="status" aria-live="polite" style="display: none; color: red;"></div>
        </form>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
