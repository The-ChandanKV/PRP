<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRP</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>PRP Web App</h1>
      <p>Starter project — authentication will be added here.</p>
      <button id="login-btn" type="button">Login with Google</button>
      <button id="logout-btn" type="button">Logout</button>
    </main>
    <div id="login-modal" class="modal">
      <div class="modal-content">
        <span class="close-button">×</span>
        <h2>Login</h2>
        <form id="login-form">
          <label for="email">Email:</label>
          <input type="email" id="email" required />
          <label for="password">Password:</label>
          <input type="password" id="password" required />
          <button type="submit" id="sign-in-button">Sign In</button>
          <div id="error-banner" role="status" aria-live="polite" style="display: none; color: red;"></div>
        </form>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
