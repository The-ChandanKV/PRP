<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRP</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/css/landing.css" />
  </head>
  <body>
    <header class="navbar">
      <nav>
        <h1>PRP Immersive Landing Page</h1>
      </nav>
    </header>
    <section class="hero">
      <div class="hero-content">
        <h1>Welcome to PRP</h1>
        <p>Discover our premium features.</p>
        <button id="login-btn" type="button" class="button">Login with Google</button>
        <button id="logout-btn" type="button" class="button">Logout</button>
      </div>
    </section>
    <section class="features">
      <div class="feature-card">
        <h2>Feature 1</h2>
        <p>Description of feature 1.</p>
      </div>
      <div class="feature-card">
        <h2>Feature 2</h2>
        <p>Description of feature 2.</p>
      </div>
      <div class="feature-card">
        <h2>Feature 3</h2>
        <p>Description of feature 3.</p>
      </div>
      <div class="feature-card">
        <h2>Feature 4</h2>
        <p>Description of feature 4.</p>
      </div>
    </section>
    <div id="login-modal" class="modal">
      <div class="modal-content">
        <span class="close-button">×</span>
        <h2>Login</h2>
        <form id="login-form">
          <label for="email">Email:</label>
          <input type="email" id="email" required />
          <label for="password">Password:</label>
          <input type="password" id="password" required />
          <button type="submit" id="sign-in-button">Sign In</button>
          <div id="error-banner" role="status" aria-live="polite" style="display: none; color: red;"></div>
        </form>
      </div>
    </div>
    <script src="/app.js"></script>
    <script src="/js/landing.js"></script>
  </body>
</html>
