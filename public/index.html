<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRP</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="hero-section">
      <div class="hero-bg"></div>
      <div class="hero-content">
        <h1 class="hero-title">Welcome to PRP</h1>
        <p class="hero-subtitle">Your gateway to an immersive experience.</p>
        <button id="login-btn" type="button" class="cta-button">Login with Google</button>
        <button id="logout-btn" type="button" class="cta-button">Logout</button>
      </div>
    </header>
    <main class="container">
      <h2>Key Features</h2>
      <div class="features-grid">
        <div class="feature-card">
          <h3>Feature 1</h3>
          <p>Description of feature 1.</p>
        </div>
        <div class="feature-card">
          <h3>Feature 2</h3>
          <p>Description of feature 2.</p>
        </div>
        <div class="feature-card">
          <h3>Feature 3</h3>
          <p>Description of feature 3.</p>
        </div>
        <div class="feature-card">
          <h3>Feature 4</h3>
          <p>Description of feature 4.</p>
        </div>
      </div>
    </main>
    <div id="login-modal" class="modal">
      <div class="modal-content">
        <span class="close-button">×</span>
        <h2>Login</h2>
        <form id="login-form">
          <label for="email">Email:</label>
          <input type="email" id="email" required />
          <label for="password">Password:</label>
          <input type="password" id="password" required />
          <button type="submit" id="sign-in-button">Sign In</button>
          <div id="error-banner" role="status" aria-live="polite" style="display: none; color: red;"></div>
        </form>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
